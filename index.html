<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>

<!-- Preload critical bundled stylesheet -->
<link rel="preload" href="css/app-combined.css?v=2.4.3" as="style">
<link rel="stylesheet" href="css/app-combined.css?v=2.4.3">
<link rel="stylesheet" href="css/mobile-system.css?v=2.4.3">

<!-- Google Fonts (Optimized: 400, 600, 700 only) -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Instant Boot Loader Styles (Above the fold) -->
<style>
  @keyframes bootSpin { to { transform: rotate(360deg); } }
  #bootLoader {
    position: fixed;
    inset: 0;
    background: #0f172a;
    z-index: 99999;
    display: grid;
    place-items: center;
    transition: opacity 0.3s ease, visibility 0.3s;
  }
  #bootLoader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
</style>

<!-- Immediate Safety Stubs for Buttons (so clicks work from millisecond 0) -->
<script>
  window.quick = window.quick || function(role) {
    var u = document.getElementById('lUser');
    var p = document.getElementById('lPass');
    if (u) u.value = role;
    if (p) p.value = '1234';
    if (typeof window.doLogin === 'function' && window.doLogin !== window._stubLogin) {
      window.doLogin();
    } else {
      window._pendingQuick = role;
    }
  };
  window._stubLogin = function() {
    window._pendingLogin = true;
  };
  window.doLogin = window.doLogin || window._stubLogin;
  window.togglePasswordVisibility = window.togglePasswordVisibility || function() {
    var inp = document.getElementById('lPass');
    var icon = document.getElementById('eyeIcon');
    if (!inp) return;
    if (inp.type === 'password') {
      inp.type = 'text';
      if (icon) icon.textContent = '🙈';
    } else {
      inp.type = 'password';
      if (icon) icon.textContent = '👁️';
    }
  };
  window.showForgotHelp = window.showForgotHelp || function() {
    alert('කරුණාකර පරිපාලක (Admin) අමතන්න.');
  };
  // BootLoader safety dismissal timeout (prevents infinite stuck loading screen)
  setTimeout(function() {
    var bl = document.getElementById('bootLoader');
    if (bl && !bl.classList.contains('hidden')) {
      bl.classList.add('hidden');
      setTimeout(function() { if (bl.parentNode) bl.parentNode.removeChild(bl); }, 400);
    }
  }, 2500);
</script>
<body>

<!-- Instant Boot Loader Screen (Displays at 0ms before JS loads) -->
<div id="bootLoader" class="app-loading">
  <div style="text-align: center; padding: 20px;">
    <div style="font-size: 54px; margin-bottom: 12px; line-height: 1;">🔧</div>
    <div style="font-size: 18px; font-weight: 700; color: #f59e0b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; letter-spacing: 0.5px;">AutoParts POS</div>
    <div style="margin: 16px auto; width: 36px; height: 36px; border: 3px solid rgba(245,158,11,0.2); border-top-color: #f59e0b; border-radius: 50%; animation: bootSpin 0.7s linear infinite;"></div>
    <div style="color: #94a3b8; font-size: 13px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">පද්ධතිය සූදානම් වෙමින් පවතී...</div>
  </div>
</div>

<!-- ============ Direct Embedded Layout (No CORS fetch needed) ============ -->
<div id="loginSlot">
  <div class="login-wrap" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <div class="ico">🔧</div>
        <h1>AutoParts POS</h1>
        <p>වාහන අමතර කොටස් විකුණුම් පද්ධතිය</p>
      </div>
      <div class="field">
        <label>පරිශීලක නාමය / Username</label>
        <input id="lUser" placeholder="username" autocomplete="username">
      </div>
      <div class="field">
        <label>මුරපදය / Password</label>
        <div class="input-with-icon">
          <input id="lPass" type="password" placeholder="••••" autocomplete="current-password">
          <button type="button" class="eye-btn" onclick="togglePasswordVisibility()" tabindex="-1" aria-label="Show password">
            <span id="eyeIcon">👁️</span>
          </button>
        </div>
        <div id="capsWarn" class="caps-warning hidden">
          ⚠️ Caps Lock ක්‍රියාත්මකයි (Caps Lock is ON)
        </div>
      </div>
      <label class="remember-row">
        <input type="checkbox" id="rememberUser">
        <span>මගේ නම මතක තබා ගන්න (Remember username)</span>
      </label>
      <div class="forgot-row">
        <button type="button" class="link-btn" onclick="showForgotHelp()">
          🔑 මුරපදය අමතක වුනාද?
        </button>
      </div>
      <button id="loginBtn" class="btn btn-primary login-btn" style="width:100%;margin-top:6px" onclick="doLogin()">
        <span id="loginBtnText">පිවිසෙන්න / Login</span>
        <span id="loginBtnSpinner" class="btn-spinner hidden">
          <span class="spinner"></span>
        </span>
      </button>
      <div id="lErr" style="color:#fca5a5;font-size:12px;margin-top:10px;text-align:center"></div>
      <div class="quick">
        <button onclick="quick('superadmin')">👑 Super Admin</button>
        <button onclick="quick('admin')">🛡️ Admin</button>
        <button onclick="quick('cashier')">💵 Cashier</button>
      </div>
      <p style="text-align:center;color:var(--muted);font-size:10.5px;margin-top:12px">
        Demo මුරපදය: 1234
      </p>
    </div>
  </div>
</div>

<div id="appSlot" class="app hidden">
  <aside id="sidebarSlot" class="sidebar">
    <div class="brand">
      <span class="ico">🔧</span>
      <div>
        <b id="brandName">AutoParts POS</b>
        <small id="brandSub">වාහන අමතර කොටස්</small>
      </div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="side-foot">
      <div class="avatar" id="uAvatar">A</div>
      <div class="u">
        <b id="uName">—</b>
        <small id="uRole">—</small>
      </div>
      <button class="btn btn-sm" onclick="doLogout()" title="පිටවීම">⏻</button>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileSidebar()"></div>
  <main class="main">
    <div id="topbarSlot">
      <header class="topbar">
        <button class="menu-btn" onclick="toggleMobileSidebar()" aria-label="මෙනුව">☰</button>
        <h2 id="pgTitle">—<small id="pgSub">—</small></h2>
        <div id="topbarShopSwitcherSlot" class="topbar-shop-slot" style="display:none"></div>
        <!-- ⭐ Shift indicator with quick action menu -->
        <span id="shiftIndicator" class="shift-badge" style="display:none" onclick="if(typeof openShiftMenu==='function')openShiftMenu();else go('shifts')"></span>

        <!-- Network status indicator & queue badge -->
        <span id="networkStatus" class="network-status online" title="Online" onclick="if(window.Offline)window.Offline.sync()">
          <span class="ns-dot"></span>
        </span>
        <span id="queueBadge" class="queue-badge hidden" title="Sync pending" onclick="if(window.Offline)window.Offline.sync()">
          0
        </span>

        <span id="roleBadge" class="badge"></span>
        <span id="clock" style="font-size:12px;color:var(--muted);font-family:'Inter',sans-serif"></span>
      </header>
    </div>
    <div class="content" id="content"></div>
  </main>

  <!-- Mobile Bottom Navigation Bar (Thumb Friendly PWA Nav) -->
  <nav id="mobileBottomNav" class="mobile-bottom-nav" aria-label="Mobile Navigation">
    <button type="button" class="bnav-item" onclick="go('billing')" data-page="billing">
      <span class="bnav-icon">💰</span>
      <span class="bnav-label">බිල්පත්</span>
    </button>
    <button type="button" class="bnav-item" onclick="go('inventory')" data-page="inventory">
      <span class="bnav-icon">📦</span>
      <span class="bnav-label">තොග</span>
    </button>
    <button type="button" class="bnav-item" onclick="go('customers')" data-page="customers">
      <span class="bnav-icon">👥</span>
      <span class="bnav-label">ණය/ගැනුම්</span>
    </button>
    <button type="button" class="bnav-item" onclick="go('dashboard')" data-page="dashboard">
      <span class="bnav-icon">🏠</span>
      <span class="bnav-label">පුවරුව</span>
    </button>
    <button type="button" class="bnav-item" onclick="toggleMobileSidebar()">
      <span class="bnav-icon">☰</span>
      <span class="bnav-label">මෙනුව</span>
    </button>
  </nav>
</div>

<div id="overlaysSlot">
  <div id="offlineBanner" class="offline-banner hidden">
    🟡 ඔබ දැන් Offline — දත්ත ලෝකල්ව සුරකියි
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <!-- Custom Date Picker Slot -->
  <div id="datePickerSlot">
    <div class="date-picker-backdrop" id="datePickerBackdrop" onclick="closeDatePicker()"></div>
    <div class="date-picker-sheet" id="datePickerSheet" role="dialog" aria-modal="true" aria-label="Date Picker">
      <div class="dp-drag-handle"></div>
      <div class="dp-header">
        <h3>📅 දිනය තෝරන්න <small>Select Date</small></h3>
        <button type="button" class="dp-close" onclick="closeDatePicker()" aria-label="Close">✕</button>
      </div>
      <div class="dp-mode-tabs">
        <button type="button" class="dp-mode-tab active" data-mode="day" onclick="dpSetMode('day')">
          <span>📅</span>
          <span>දිනය</span>
          <small>Day</small>
        </button>
        <button type="button" class="dp-mode-tab" data-mode="month" onclick="dpSetMode('month')">
          <span>📆</span>
          <span>මාසය</span>
          <small>Month</small>
        </button>
        <button type="button" class="dp-mode-tab" data-mode="year" onclick="dpSetMode('year')">
          <span>🗓️</span>
          <span>වර්ෂය</span>
          <small>Year</small>
        </button>
      </div>
      <div class="dp-nav">
        <button type="button" class="dp-nav-btn" onclick="dpPrev()" aria-label="Previous">◀</button>
        <div class="dp-nav-title" id="dpNavTitle">October 2026</div>
        <button type="button" class="dp-nav-btn" onclick="dpNext()" aria-label="Next">▶</button>
      </div>
      <div class="dp-content" id="dpContent"></div>
      <div class="dp-presets">
        <button type="button" onclick="dpQuickSelect('today')">📅 අද</button>
        <button type="button" onclick="dpQuickSelect('yesterday')">⏪ ඊයේ</button>
        <button type="button" onclick="dpQuickSelect('thisWeek')">📆 මෙම සතිය</button>
        <button type="button" onclick="dpQuickSelect('thisMonth')">🗓️ මෙම මාසය</button>
        <button type="button" onclick="dpQuickSelect('thisYear')">📊 මෙම වර්ෂය</button>
      </div>
      <div class="dp-footer">
        <button type="button" class="btn" onclick="closeDatePicker()">අවලංගු</button>
        <button type="button" class="btn btn-primary" onclick="dpConfirm()">✅ තෝරන්න</button>
      </div>
    </div>
  </div>
</div>
