<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="ico">🔧</div>
      <h1>AutoParts POS</h1>
      <p>වාහන අමතර කොටස් විකුණුම් පද්ධතිය</p>
    </div>

    <div class="field">
      <label>පරිශීලක නාමය / Username</label>
      <input id="lUser" placeholder="username" autocomplete="username">
    </div>

    <div class="field">
      <label>මුරපදය / Password</label>
      <div class="input-with-icon">
        <input id="lPass" type="password" placeholder="••••" autocomplete="current-password">
        <button type="button" class="eye-btn" onclick="togglePasswordVisibility()" tabindex="-1" aria-label="Show password">
          <span id="eyeIcon">👁️</span>
        </button>
      </div>
      <div id="capsWarn" class="caps-warning hidden">
        ⚠️ Caps Lock ක්‍රියාත්මකයි (Caps Lock is ON)
      </div>
    </div>

    <label class="remember-row">
      <input type="checkbox" id="rememberUser">
      <span>මගේ නම මතක තබා ගන්න (Remember username)</span>
    </label>

    <div class="forgot-row">
      <button type="button" class="link-btn" onclick="showForgotHelp()">
        🔑 මුරපදය අමතක වුනාද?
      </button>
    </div>

    <button id="loginBtn" class="btn btn-primary login-btn" style="width:100%;margin-top:6px" onclick="doLogin()">
      <span id="loginBtnText">පිවිසෙන්න / Login</span>
      <span id="loginBtnSpinner" class="btn-spinner hidden">
        <span class="spinner"></span>
      </span>
    </button>

    <div id="lErr" style="color:#fca5a5;font-size:12px;margin-top:10px;text-align:center"></div>

    <!-- ⚡ Powered by MR.Link Technology & Contact Us -->
    <div class="login-brand-footer">
      <div class="lbf-brand">
        <span class="lbf-spark">⚡</span> Powered by <strong>MR.Link Technology</strong>
      </div>
      <div class="lbf-meta">
        <span class="lbf-owner">Owner: <strong>Dimuthu</strong></span>
        <span class="lbf-sep">•</span>
        <button type="button" class="lbf-contact-btn" onclick="openContactModal()">
          📞 Contact Us
        </button>
      </div>
    </div>
  </div>
</div>
