<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="darkAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container (20% corner radius) -->
  <rect width="512" height="512" rx="102" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="98" fill="none" stroke="#fef3c7" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Background decorative gear wheel silhouette -->
  <g opacity="0.12" fill="#ffffff" transform="translate(256, 256)">
    <circle r="170" fill="none" stroke="#ffffff" stroke-width="28" stroke-dasharray="32 18"/>
    <circle r="120" fill="none" stroke="#ffffff" stroke-width="12"/>
    <circle r="70" fill="none" stroke="#ffffff" stroke-width="8"/>
  </g>

  <!-- Main Symbol: Polished Auto Wrench & Parts Emblem -->
  <g filter="url(#dropShadow)" transform="translate(256, 230)">
    <!-- Diagonal Wrench -->
    <g transform="rotate(-45)">
      <!-- Wrench Handle -->
      <rect x="-24" y="-130" width="48" height="260" rx="20" fill="url(#metalGrad)"/>
      <rect x="-10" y="-100" width="20" height="200" rx="10" fill="#94a3b8" opacity="0.35"/>
      <!-- Top Open End -->
      <path d="M -60 -130 C -60 -185 60 -185 60 -130 C 60 -105 40 -90 40 -90 L 18 -120 L -18 -120 L -40 -90 C -40 -90 -60 -105 -60 -130 Z" fill="url(#metalGrad)"/>
      <!-- Bottom Ring End -->
      <circle cx="0" cy="130" r="48" fill="url(#metalGrad)"/>
      <circle cx="0" cy="130" r="26" fill="url(#darkAcc)"/>
    </g>
  </g>

  <!-- AutoParts Monogram Label Badge -->
  <g transform="translate(256, 420)">
    <rect x="-110" y="-32" width="220" height="56" rx="16" fill="url(#darkAcc)" stroke="#f59e0b" stroke-width="3"/>
    <text x="0" y="7" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#f8fafc" letter-spacing="4" text-anchor="middle">AUTOPARTS</text>
  </g>
</svg>
